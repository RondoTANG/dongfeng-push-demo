version: "0.1"
updated_at: "2026-09-04"
owner: "产品"
reviewer: "运营"

source_validation:
  non_event_page_rules:
    - title_pattern: "聚合所有.*(?:新闻|快讯)|第[0-9]+页[-—].*资讯|企业新闻|品牌官网|官方网站|【官网】"
      reason: "栏目、滚动资讯或官网常驻页不是单一近期事件，须使用具体内容详情链接"
    - url_pattern: "https?://[^/]*tousu\\.sina\\.com\\.cn/company/view"
      reason: "企业投诉汇总页不是单一事件，须使用具体投诉详情链接"
    - url_pattern: "https?://(?:www\\.)?weibo\\.com/(?:u/)?[0-9]+/?(?:[?#].*)?$"
      reason: "微博账号主页不是单条微博，须使用具体内容详情链接"
  required_fields:
    - original_url
    - title_or_snippet
    - retrieved_by
    - fetched_at
  invalid_rules:
    - rule_id: INV001
      name: "无法访问或无有效URL"
      condition: "original_url为空，或重试后仍无法访问且无可核验证据"
      action: auto_discard
    - rule_id: INV002
      name: "同名词误匹配"
      condition: "未匹配active品牌实体，且不满足行业事件品牌关联"
      action: auto_discard
    - rule_id: INV003
      name: "纯招投标采购招聘行政信息"
      condition: "内容类型只属于招标、采购、招聘、组织任免或内部行政，且无外部传播事件"
      action: auto_discard
    - rule_id: INV004
      name: "纯促销引流"
      condition: "仅包含经销商报价、优惠、联系方式或到店引流，无新的品牌事件"
      action: auto_discard
    - rule_id: INV005
      name: "旧闻重新索引"
      condition: "可核验发布时间超过采集时刻前72小时；旧事件的新回应必须作为独立近期内容留证，不用搜索获取时间放行旧页面"
      action: auto_discard
    - rule_id: INV006
      name: "无实际事件"
      condition: "品牌口号、导航、百科、常驻产品页、滚动资讯或投诉汇总页不是单一事件；按non_event_page_rules识别，须有具体内容详情链接"
      action: auto_discard
    - rule_id: INV007
      name: "行业事件无目标品牌关系"
      condition: "行业事件经9品牌完整关联补采后仍为no_relation"
      action: auto_discard
    - rule_id: INV008
      name: "发布时间无法核验"
      condition: "供应商字段和正文头部均无可靠发布时间，或发布时间在未来；保留排除原因，暂不进入有效线索及事件队列"
      action: auto_discard
  invalid_output: invalid_log
  invalid_requires_human_review: false

url_normalization:
  remove_tracking_parameters: true
  tracking_parameter_prefixes:
    - utm_
    - from
    - source
    - share_token
  resolve_short_url: true
  preserve_original_url: true
  deduplicate_by_canonical_url: true
  merge_retrieved_by_when_same_url: true
  discovery_trace_rule: "同一URL的每次工具发现、查询词和搜索时间写入source_discoveries，不覆盖历史发现路径"

source_resolution:
  config_ref: "来源平台字典_v0.1.yaml"
  resolve_by_final_domain: true
  extract_visible_account_only: true
  unresolved_account_value: null
  unresolved_account_flag: account_unresolved
  unknown_domain_action: pending_source_confirmation

time_normalization:
  timezone: "Asia/Shanghai"
  fields:
    - published_at
    - event_at
    - first_seen_at
  confidence_enum:
    - high
    - medium
    - low
    - unknown
  missing_time_action: "暂不纳入工作台，写入INV008排除记录；不得将搜索时间当作发布时间"
  extraction_rule: "优先解析正文头部的发布／浏览等元信息行，再用供应商发布时间；不从叙事段落推断发布日期。缺年份的月日按最近过去日期推定，并标为中等置信度。"
  window_rules:
    - window: "0-24h"
      action: eligible
    - window: "24-72h"
      action: "作为延迟收录线索允许进入；展示实际发布时间，不代表热点"
    - window: ">72h"
      action: "auto_discard；新回应须由独立近期内容作为新线索证明"

entity_resolution:
  config_ref: "品牌实体字典_v0.1.yaml"
  brand_resolution:
    deterministic_match_status:
      - active
    exact_alias_first: true
    weak_alias_requires_context: true
  event_entity_resolution:
    entity_types:
      - model
      - person
      - campaign
      - organization
    master_registry_required: false
    evidence_sufficient_action: "写入event.entity_mentions，并保留证据来源"
    uncertainty_output_field: entity_uncertainties
    uncertainty_action: manual_review_with_event
    required_uncertainty_fields:
      - entity_name_raw
      - entity_type
      - uncertainty_reason
      - proposed_relation
      - evidence_source_ids
    no_global_confirmation_queue: true

content_deduplication:
  levels:
    - level: exact_url
      action: "合并为一个source_item；工具、查询词、搜索时间逐条写入source_discoveries"
    - level: exact_content_fingerprint
      action: "保留一个正文记录，其他记录标记duplicate_of_source_id"
    - level: repost
      action: "保留各发布来源并标记is_repost，不计为独立事实来源"

event_clustering:
  event_key_components:
    - primary_entity_id_or_name
    - event_action
    - event_object
    - event_date
  minimum_cluster_evidence: 1
  aggregation_rule: "不同URL但事件键一致时聚合为同一event；所有source_item必须保留"
  independent_source_rule: "同一原始发布主体的跨平台转载只计1个独立来源"
  aggregation_page_rule: "一个列表页包含多个事件时，按事件动作拆分为多个event，并保留同一source_id作为证据"
  evidence_breadth_rule: "independent_source_count只表示证据广度，不得作为平台热度或传播规模"

hotspot_data_readiness:
  required_capabilities:
    - platform_content_id
    - native_engagement_metrics
    - metric_timeseries
    - author_or_unique_ugc_identity
    - platform_coverage_and_collected_at
  missing_any_capability_output:
    hotspot_judgement_available: false
    hotspot_status: unknown
    hotspot_unavailable_reason: "列出缺失能力"
  search_provider_default:
    hotspot_judgement_available: false
    hotspot_status: unknown
    hotspot_unavailable_reason: "公开搜索不提供平台原生互动指标、连续快照与完整覆盖"
  prohibited_heat_signals:
    - search_rank
    - total_search_result_count
    - media_repost_count
    - provider_authority_level
    - ai_subjective_score
  production_rule: "只有满足来源平台字典定义的热点判定数据准入条件后，才能按平台配置热度模型；不同平台不得直接共用统一原始数值阈值"

industry_brand_relation:
  direct_match_requires_active_entity: true
  direct_match_status: direct_mention
  expanded_match_requires_accessible_evidence: true
  expanded_match_status: verified_relation
  no_evidence_status: no_relation
  no_relation_action: auto_discard

risk_gate:
  rules:
    - {tag: sales_volume, name: "销量与交付数据", enabled: true, keywords: ["销量", "交付量"], description: "核对统计周期、单位及数据来源"}
    - {tag: price_or_discount, name: "价格与优惠", enabled: true, keywords: ["售价", "价格", "优惠"], description: "核对车型版本、权益条件与有效期"}
    - {tag: accident_or_safety, name: "事故与安全", enabled: true, keywords: ["事故", "安全", "自燃"], description: "核实事故与安全相关事实，不凭关键词认定负面"}
    - {tag: recall, name: "产品召回", enabled: true, keywords: ["召回"], description: "以召回公告核对范围与原因"}
    - {tag: regulation, name: "监管与政策", enabled: true, keywords: ["监管", "处罚"], description: "核对发布机构、适用范围和执行时间"}
    - {tag: competitor_comparison, name: "竞品对比", enabled: true, keywords: ["对比", "竞品"], description: "核对对比条件一致性及证据"}
    - {tag: intelligent_driving_l3, name: "智能驾驶能力表述", enabled: true, keywords: ["L3", "智能驾驶", "智驾"], description: "核对辅助驾驶能力、适用条件及宣传口径"}
    - {tag: negative_sentiment, name: "争议或负面线索", enabled: true, keywords: ["亏损", "投诉", "争议", "负面"], description: "仅作风险提醒，须核实语境和事实"}
    - {tag: fact_conflict, name: "事实冲突", enabled: true, keywords: [], description: "由证据核验或人工确认触发，不作关键词匹配"}
  risk_tags:
    - sales_volume
    - price_or_discount
    - accident_or_safety
    - recall
    - regulation
    - competitor_comparison
    - intelligent_driving_l3
    - negative_sentiment
    - fact_conflict
  high_risk_action: pending_review
  ai_may_clear_high_risk: false

event_decision:
  - status: relevant_event_clue
    conditions:
      - "event_at或published_at在72小时内，优先展示24小时内线索"
      - "品牌关系为direct_mention或verified_relation"
      - "至少1条可访问且能支持核心事实的来源"
      - "能够形成原创评论或原创内容任务"
      - "不存在未解除的高风险门禁"
      - "hotspot_status保持unknown，不输出真实热点结论"
  - status: brand_content_opportunity
    conditions:
      - "event_at或published_at在24小时内"
      - "至少1个已确认品牌官方来源"
      - "存在明确新增事实"
      - "属于品牌主动内容机会，不声称已形成外部热点"
      - "不存在未解除的高风险门禁"
  - status: pending_review
    any_conditions:
      - "命中高风险标签"
      - "只有单一二手来源但事件可能有作业价值"
      - "事实、主体或时间存在冲突"
      - "品牌关系为unresolved"
      - "entity_uncertainties非空，包含无法确认的车型、人物、活动或机构关系"
      - "时间缺失但来源可访问"
  - status: rejected
    conditions:
      - "运营审核认定不值得生成作业，或事实证据不足且无明确可补证路径"

task_generation:
  allowed_event_status:
    - relevant_event_clue
    - brand_content_opportunity
  poc_action: "生成draft_pending_review，不自动下发"
  supported_task_types:
    - original_comment
    - original_content
    - like_boost_observation
  required_fields:
    - event_id
    - task_type
    - task_title
    - recommended_platforms
    - target_member_tags
    - evidence_source_ids
    - risk_notes
  target_platform_rule: "根据事件来源平台、内容形态和用户现有平台能力标签生成建议；不得把source_platform直接等同于recommended_platforms"
