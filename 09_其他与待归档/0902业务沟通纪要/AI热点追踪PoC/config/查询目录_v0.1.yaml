version: "0.1"
updated_at: "2026-09-03"
owner: "产品"

execution:
  full_coverage_each_run: true
  cost_limit_enabled: false
  manual_trigger_enabled: true
  scheduled_trigger_enabled: false
  scheduled_cron: null
  lookback_hours: 24
  late_signal_hours: 72
  base_providers:
    - doubao_global_search
    - codex_web_search
  relation_providers:
    - doubao_global_search
    - codex_web_search
  page_open_provider:
    - codex_web_search
  provider_failure_policy: "记录失败并继续其他采集器；不得把未执行视为无结果"
  provider_job_counts:
    full:
      query_count: 17
      provider_count: 2
      planned_job_count: 34
    quick:
      query_count: 1
      provider_count: 2
      planned_job_count: 2
  manual_cooldown:
    full_seconds: 10800
    quick_seconds: 600
    enforcement: server_side
    duplicate_action: "拒绝重复启动并返回剩余等待时间；不得只依赖前端按钮置灰"
  manual_confirmation:
    required: true
    display_fields:
      - query_count
      - provider_count
      - planned_job_count
      - providers
  schedule_state: paused
  schedule_note: "自动采集暂停；仅保留手工完整运行、快速验证和确认后的定向补证"

