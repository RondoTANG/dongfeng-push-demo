industry_brand_relation:
  enabled: true
  trigger: "行业结果通过来源级有效性过滤后"
  scope: all_active_brands
  query_template: "{event_core_term} {brand_name}"
  providers:
    - doubao_global_search
    - codex_web_search
  relation_status_enum:
    - direct_mention
    - verified_relation
    - no_relation
    - unresolved
  pass_status:
    - direct_mention
    - verified_relation
  no_relation_action: "写入invalid_log，原因industry_event_without_target_brand_relation"

evidence_expansion:
  enabled: true
  execution_mode: preview_then_confirm
  preview_required: true
  preview_fields:
    - unresolved_question
    - proposed_queries
    - proposed_providers
    - planned_call_count
    - requester
  confirm_required: true
  no_clear_question_action: reject_or_return_to_review
  trigger_conditions:
    - "只有品牌官方来源，没有独立外部来源"
    - "只有二手来源，没有官方事实"
    - "发布时间、事件时间或主体存在冲突"
    - "命中高风险主题"
  query_templates:
    - "{primary_entity} {event_action}"
    - "{event_core_term} {primary_entity}"
  all_templates_each_trigger: true
  providers:
    - doubao_global_search
    - codex_web_search
