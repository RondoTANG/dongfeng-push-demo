version: "0.1"
updated_at: "2026-09-04"
owner: "产品"
reviewer: "运营"

registry_policy:
  active_status: "active"
  master_data_scope:
    - brand
  active_only_for_deterministic_match: true
  unknown_brand_action: "保留原始名称并随事件进入人工审核，不自动新增品牌主数据"
  alias_uniqueness_required: true
  weak_alias_requires_automotive_context: true
  status_enum:
    - active
    - pending_confirmation
    - inactive
  change_requirements:
    - "记录修改人、修改时间、修改原因和规则版本"
    - "别名不得同时绑定两个active实体"
    - "品牌归属变更后只影响新运行批次，不回写历史证据"

event_entity_resolution:
  entity_types:
    - model
    - person
    - campaign
    - organization
  master_registry_required: false
  confirmed_in_event_when:
    - "原文明确出现实体名称，且可访问证据能够支持其与事件、品牌的关系"
    - "名称、身份或归属不存在互相冲突的证据"
  uncertain_when:
    - "疑似新车型、新活动或新人物身份，现有证据不足以确认是否正式存在"
    - "车型与品牌、人物与职务、活动与品牌之间的关系存在冲突"
    - "只有单一弱来源或搜索摘要，无法打开正文核验"
    - "名称存在同名、简称、错别字或时间版本歧义"
  uncertain_action: "写入event.entity_uncertainties，并将该事件置为pending_review，和事件证据一起由运营判断"
  required_uncertainty_fields:
    - entity_name_raw
    - entity_type
    - uncertainty_reason
    - proposed_relation
    - evidence_source_ids
  manual_result_scope: "只确认当前事件中的表述与关系，不自动回写全局实体主数据"

