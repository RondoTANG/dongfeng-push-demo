version: "0.1"
updated_at: "2026-09-03"
owner: "产品"
reviewer: "运营"

provider_registry:
  - provider_id: doubao_global_search
    provider_type: search_api
    status: active
    role: "公开网页广召回和结构化摘要"
    can_decide_source_authority: false
    data_capabilities:
      content_discovery: true
      source_url: true
      published_time: partial_requires_verification
      native_engagement_metrics: false
      metric_timeseries: false
      platform_content_id: false
      author_influence: false
      full_platform_coverage: false
      hotspot_judgement: false
    endpoint: "https://open.feedcoopapi.com/search_api/global_search"
    method: POST
    credential_ref: "macOS Keychain guard-army-doubao-search/api-key 或 DOUBAO_SEARCH_API_KEY"
    request_defaults:
      search_type: web
      doc_count: 3
      max_snippet_length: 1000
      max_image_count_per_doc: 1
  - provider_id: codex_web_search
    provider_type: agent_search
    status: active_for_poc
    role: "公开网页补召回、页面打开和证据核验"
    can_decide_source_authority: false
    data_capabilities:
      content_discovery: true
      source_url: true
      published_time: partial_requires_verification
      native_engagement_metrics: false
      metric_timeseries: false
      platform_content_id: false
      author_influence: false
      full_platform_coverage: false
      hotspot_judgement: false
    endpoint: null
    credential_ref: null
    production_replacement_required: true
  - provider_id: existing_engagement_collector
    provider_type: known_url_metric_service
    status: available_pending_interface_integration
    role: "用户回填原创链接后的基础互动指标采集，用于效果快照和加热判断"
    can_decide_source_authority: false
    endpoint: null
    credential_ref: null
    data_capabilities:
      content_discovery: false
      known_url_metric_lookup: true
      source_url: true
      platform_content_id: "由回填链接解析；真实字段待接口确认"
      native_engagement_metrics: partial_by_platform
      metric_timeseries: "系统通过多次调用保存快照形成"
      author_influence: false
      full_platform_coverage: false
      hotspot_judgement: false
    platform_metric_availability:
      douyin:
        available: true
        metrics: [like_count, comment_count]
      kuaishou:
        available: true
        metrics: [like_count, comment_count, share_count]
      weibo:
        available: true
        metrics: [repost_count, comment_count, like_count]
      news_aggregator:
        available: true
        applies_to: [toutiao]
        metrics: [play_count, like_count, comment_count]
      xiaohongshu:
        available: true
        metrics: [like_count, comment_count]
      zhihu:
        available: true
        metrics: [upvote_count, comment_count, share_count]
      bilibili:
        available: true
        metrics: [like_count, comment_count]
      yiche:
        available: true
        metrics: [comment_count, like_count, engagement_count]
      dongchedi:
        available: true
        metrics: [comment_count, like_count, engagement_count]
      autohome:
        available: true
        metrics: [read_count, comment_count, like_count, engagement_count]
      wechat_official_account:
        available: false
        fallback: manual_evidence
      wechat_channels:
        available: false
        fallback: manual_evidence
    source_ref: "../../../数据采集现状.xlsx"
  - provider_id: professional_sentiment_provider
    provider_type: platform_data_service
    status: pending_selection_and_poc
    role: "生产级平台内容、原生互动指标与连续快照数据源"
    can_decide_source_authority: false
    endpoint: null
    credential_ref: null
    data_capabilities:
      content_discovery: pending_contract_verification
      source_url: pending_contract_verification
      published_time: pending_contract_verification
      native_engagement_metrics: pending_contract_verification
      metric_timeseries: pending_contract_verification
      platform_content_id: pending_contract_verification
      author_influence: pending_contract_verification
      full_platform_coverage: pending_contract_verification
      hotspot_judgement: "系统基于供应商原始数据自研，供应商结论只作参考"
    selection_gate:
      - "明确覆盖的平台、账号类型和内容范围"
      - "提供平台内容ID及原始发布时间"
      - "提供播放/曝光、点赞、评论、转发、收藏等原生指标"
      - "支持连续快照或增量接口，可计算1h/3h/24h增长"
      - "提供采集延迟、漏采说明、失败重试和审计留痕"
      - "通过业务样本回放后才能激活"

