resolution_policy:
  resolve_after_redirect: true
  unknown_domain_platform: unknown
  unknown_domain_action: "保留记录并进入来源待确认队列"
  account_name_rule: "只提取页面明确展示的账号名，不从标题、摘要或品牌名猜测"
  account_id_rule: "只保存页面或接口明确返回的账号ID；无法取得时为null"
  provider_authority_rule: "豆包HostInfo.AuthorityLevel仅保留为provider_authority_level，不映射为业务来源等级"
  search_rank_rule: "豆包Rank与TotalDocCount、Codex搜索排序及结果数只表示搜索召回，不得解释为平台热度"
  hotspot_capability_rule: "provider.data_capabilities.hotspot_judgement不为true时，该来源只能形成信息线索，热点状态必须为unknown"
  official_rule: "只有domain_rules或运营确认的账号配置可标记为official"
