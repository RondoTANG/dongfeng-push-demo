version: "0.1"
updated_at: "2026-09-03"
owner: "产品"
reviewer: "运营"

stage_control:
  poc_mode: dual_draft_only
  auto_publish_enabled: false
  manual_approval_required: true
  response_window_hours: 24
  approval_roles:
    - "运营"

task_type_mapping:
  relevant_event_clue:
    allowed_task_types:
      - original_comment
      - original_content
      - source_content_boost
    default_task_type: original_content
  brand_content_opportunity:
    allowed_task_types:
      - original_comment
      - original_content
      - source_content_boost
    default_task_type: original_content
  manual_review:
    allowed_task_types: []
    default_task_type: null
  watch:
    allowed_task_types: []
    default_task_type: null

platform_recommendation:
  source_platform_is_not_target_platform: true
  supported_target_platforms:
    - weibo
    - douyin
    - wechat_official_account
    - wechat_channels
  rules:
    - rule_id: PLT001
      condition: "事件证据主要来自微博且内容适合短文本观点"
      recommend:
        - weibo
    - rule_id: PLT002
      condition: "事件具备视频表达素材或现场内容"
      recommend:
        - douyin
        - wechat_channels
    - rule_id: PLT003
      condition: "事件适合中长篇事实梳理或观点表达"
      recommend:
        - wechat_official_account
    - rule_id: PLT004
      condition: "无法确定内容形态"
      recommend: []
      action: "运营选择目标平台"

member_selection:
  source: "护卫军现有平台能力标签"
  required_label_dimension: platform_capability
  rules:
    - "微博任务只进入微博能力标签匹配人群"
    - "抖音任务只进入抖音能力标签匹配人群"
    - "公众号任务只进入公众号能力标签匹配人群"
    - "视频号任务只进入视频号能力标签匹配人群"
    - "用户可同时进入多个平台人群，但同一任务不得重复下发"
  missing_label_action: "不自动选择用户，进入运营人工选人"
  label_api: null
  label_api_status: pending_integration

task_draft_templates:
  shared_required_fields:
    - task_title
    - task_brief
    - response_deadline
    - recommended_platforms
    - target_member_tags
    - evidence_source_ids
    - official_fact_summary
    - prohibited_claims
    - risk_notes
    - draft_purpose
  original_growth:
    task_types:
      - original_comment
      - original_content
    generation_rule: "仅基于已核验证据生成原创任务背景和创作方向，不生成用户可直接复制的话术"
  source_content_boost:
    task_type: source_content_boost
    extra_required_fields:
      - target_source_id
      - target_url
      - target_content_title
      - engagement_actions
    target_rule: "必须绑定当前事件证据中的一条具体平台文章或视频；官网、普通网页、平台不明或无有效链接的来源不得生成加热草案"
    generation_rule: "直接对目标文章或视频本身组织点赞、正向评论等真实互动，不要求用户另行发布原创内容"
    supported_actions:
      - like
      - positive_comment
      - repost
      - favorite
    risk_rule: "运营确认目标内容、平台、动作、人数和时间窗；禁止集中刷量、复制统一评论和超出证据的表述"
  original_post_boost:
    task_type: original_post_boost
    extra_required_fields:
      - target_submission_id
      - trigger_evaluation_id
      - target_url
      - target_content_title
      - engagement_actions
    target_rule: "必须绑定已审批原创的实际发布记录和后效判断，不得使用热点源内容的target_source_id"
    generation_rule: "至少两个同一内容、同一平台、同口径快照后，由运营选择create_followup_boost才生成二次加热草案"
    supported_actions:
      - like
      - positive_comment
      - repost
      - favorite
    risk_rule: "指标缺失、口径不同或数值回退时进入人工核验；二次加热仍需独立审批，不自动执行互动"
  hotspot_disclaimer_rule: "事件仅来自搜索来源时，草案必须显示‘公开信息线索，非真实热点结论’，不得使用爆发、热搜、全网热议等未经原生数据证明的表述"
  default_status: draft_pending_review

early_publish_reward:
  enabled: false
  status: pending_business_confirmation
  required_metrics:
    - publish_time
    - platform_content_id
    - engagement_snapshot
  scoring_rule: null
  note: "会议提出越早发布、流量越高应有更高奖励；具体倍率和结算时间未确认"

source_content_boost:
  enabled: true
  status: poc_draft_only
  source_selection:
    must_belong_to_event_evidence: true
    target_count_per_draft: 1
    require_valid_url: true
    require_actionable_platform: true
    invalid_source_types:
      - brand_official_website_without_interaction_entry
      - general_web
      - unknown
  decision_inputs:
    - event_evidence
    - target_source_platform
    - target_content_url
    - content_risk
    - operator_business_judgement
  note: "当前公开搜索不能证明真实热点，PoC仅在运营确认值得行动后生成源文章/视频加热草案；不自动发布"

boost_followup:
  trigger_metric_source: existing_engagement_collector
  auto_publish_enabled: false
  note: "兼容配置校验入口；后效数据可由现有采集器、业务推送或人工凭证补充，所有加热草案均需人工审批"

original_post_performance_followup:
  enabled: true
  status: poc_draft_only
  publication_preconditions:
    - "仅approved的original_growth草案可登记"
    - "发布URL必须有效且唯一"
  snapshot_sources:
    - existing_collector
    - business_push
    - manual_evidence
  evaluation_preconditions:
    minimum_comparable_snapshots: 2
    compare_scope: same_publication_same_platform_same_metric_schema
    anomaly_rule: "缺失、口径变化或指标回退时进入人工核验，不生成二次加热草案"
  decisions:
    - create_followup_boost
    - watch
    - no_boost
    - manual_review
  note: "保留热点源内容直接加热；本能力是原创增长发布后的独立后效分支，只到二次加热草案审批，不执行互动"
