<!DOCTYPE html>
<html>
<head>
<style>
  .phone { width: 375px; height: 812px; border: 2px solid red; position: relative; margin: 50px; }
  .landscape {
    position: absolute; top: 0; left: 0;
    width: 812px; height: 375px;
    background: rgba(0,0,255,0.5);
    transform-origin: top left;
    transform: translateX(375px) rotate(90deg);
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="landscape">LANDSCAPE</div>
  </div>
</body>
</html>
